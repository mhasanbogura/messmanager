apply plugin: 'com.android.application'

def versionFile = file('build.gradle')

task bumpVersion {
    doLast {
        def content = versionFile.text
        def versionCodeMatcher = (content =~ /versionCode (\d+)/)
        def versionNameMatcher = (content =~ /versionName "([\d.]+)"/)
        if (versionCodeMatcher.find() && versionNameMatcher.find()) {
            def oldCode = versionCodeMatcher.group(1) as int
            def oldName = versionNameMatcher.group(1)
            def newCode = oldCode + 3
            def parts = oldName.split('\\.')
            def major = parts[0] as int
            def minor = parts.length > 1 ? parts[1] as int : 0
            def patch = parts.length > 2 ? parts[2] as int : 0
            patch += 1
            if (patch > 99) { patch = 0; minor += 1 }
            if (minor > 99) { minor = 0; major += 1 }
            def newName = "${major}.${minor}.${patch}"
            content = content.replaceFirst(/versionCode \d+/, "versionCode ${newCode}")
            content = content.replaceFirst(/versionName "[\d.]+"/, "versionName \"${newName}\"")
            versionFile.text = content
            project.ext.newVersion = newName
            project.ext.newBuild = newCode
            println "Version bumped: ${oldName} -> ${newName}, build: ${oldCode} -> ${newCode}"
        }
    }
}

task stampVersion {
    doLast {
        def content = versionFile.text
        def codeMatcher = (content =~ /versionCode (\d+)/)
        def nameMatcher = (content =~ /versionName "([\d.]+)"/)
        if (codeMatcher.find() && nameMatcher.find()) {
            def v = nameMatcher.group(1)
            def b = codeMatcher.group(1)
            def cfgV = android.defaultConfig.versionName
            def cfgB = "${android.defaultConfig.versionCode}"
            if (v != cfgV || b != cfgB) {
                throw new GradleException("Version mismatch: build.gradle on disk is ${v} (build ${b}) but this build was configured with ${cfgV} (build ${cfgB}). The APK manifest would get the configured version. Run bumpVersion in a SEPARATE Gradle invocation before the build (./gradlew bumpVersion, then ./gradlew release).")
            }
            def projRoot = project.projectDir.parentFile.parentFile
            ["app.js", "www/app.js", "android/app/src/main/assets/public/app.js"].each { rel ->
                def f = new File(projRoot, rel)
                if (!f.exists()) return
                def t = f.text
                t = t.replaceAll(/prof_version:'Version [^']*'/, "prof_version:'Version ${v} (build ${b})'")
                t = t.replaceAll(/prof_version:'ভার্সন [^']*'/, "prof_version:'ভার্সন ${v} (বিল্ড ${b})'")
                f.text = t
            }
            println "Stamped web version: ${v} (build ${b})"
        }
    }
}

project.afterEvaluate {
    tasks.findByName('assembleDebug')?.dependsOn('stampVersion')
    tasks.findByName('mergeDebugAssets')?.dependsOn('stampVersion')
}

task release {
    dependsOn 'assembleDebug'
    doLast {
        def content = versionFile.text
        def currentCodeMatcher = (content =~ /versionCode (\d+)/)
        def currentNameMatcher = (content =~ /versionName "([\d.]+)"/)
        def v = currentNameMatcher[0][1]
        def b = currentCodeMatcher[0][1] as int

        def apkName = "MessManager.apk"
        def apkPath = file("${buildDir}/outputs/apk/debug/app-debug.apk")
        def tagName = "v${v}"
        def rootDir = project.projectDir.parentFile
        def ghBin = new File(System.getProperty("user.home"), ".local/bin/gh").absolutePath
        def apkStore = "/home/mhasanbogura/Google Drive/mahmudulhasandhk70/Apk Store/Android"
        def storeApkName = "Mess Manager_com.mahmuduls.messmanager_v${v}_build_${b}.apk"

        println "Release v${v} build ${b}..."

        exec {
            workingDir rootDir
            commandLine 'cp', apkPath.absolutePath, "${rootDir}/${apkName}"
        }

        exec {
            workingDir rootDir
            commandLine 'bash', '-c', "rm -f '${apkStore}/MessManager.apk' '${apkStore}/mess-manager.apk' '${apkStore}/Mess Manager_com.mahmuduls.messmanager_'*.apk"
            ignoreExitValue = true
        }
        exec {
            workingDir rootDir
            commandLine 'cp', apkPath.absolutePath, "${apkStore}/${storeApkName}"
        }

        exec {
            workingDir rootDir
            commandLine 'git', 'add', '-A'
        }
        exec {
            workingDir rootDir
            commandLine 'git', 'commit', '-m', "v${v} build ${b}"
            ignoreExitValue = true
        }
        exec {
            workingDir rootDir
            commandLine 'git', 'push'
        }

        exec {
            workingDir rootDir
            commandLine ghBin, 'release', 'delete', tagName, '--yes'
            ignoreExitValue = true
        }
        exec {
            workingDir rootDir
            commandLine ghBin, 'release', 'create', tagName,
                "${rootDir}/${apkName}",
                '--title', "Mess Manager v${v} (build ${b})",
                '--notes', "Mess Manager v${v} build ${b}\nPackage: com.mahmuduls.messmanager",
                '--latest'
        }

        println "Released ${tagName} on GitHub with ${apkName}"
    }
}

android {
    namespace "com.mahmuduls.messmanager"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mahmuduls.messmanager"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 577
        versionName "1.4.85"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    configurations.all {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
