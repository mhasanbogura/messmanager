apply plugin: 'com.android.application'

def versionFile = file('build.gradle')

task bumpVersion {
    doLast {
        def content = versionFile.text
        def versionCodeMatcher = (content =~ /versionCode (\d+)/)
        def versionNameMatcher = (content =~ /versionName "([\d.]+)"/)
        if (versionCodeMatcher.find() && versionNameMatcher.find()) {
            def oldCode = versionCodeMatcher.group(1) as int
            def oldName = versionNameMatcher.group(1)
            def newCode = oldCode + 3
            def parts = oldName.split('\\.')
            def major = parts[0] as int
            def minor = parts.length > 1 ? parts[1] as int : 0
            def patch = parts.length > 2 ? parts[2] as int : 0
            patch += 1
            if (patch > 99) { patch = 0; minor += 1 }
            if (minor > 99) { minor = 0; major += 1 }
            def newName = "${major}.${minor}.${patch}"
            content = content.replaceFirst(/versionCode \d+/, "versionCode ${newCode}")
            content = content.replaceFirst(/versionName "[\d.]+"/, "versionName \"${newName}\"")
            versionFile.text = content
            project.ext.newVersion = newName
            project.ext.newBuild = newCode
            println "Version bumped: ${oldName} -> ${newName}, build: ${oldCode} -> ${newCode}"
        }
    }
}

task stampVersion {
    doLast {
        def content = versionFile.text
        def codeMatcher = (content =~ /versionCode (\d+)/)
        def nameMatcher = (content =~ /versionName "([\d.]+)"/)
        if (codeMatcher.find() && nameMatcher.find()) {
            def v = nameMatcher.group(1)
            def b = codeMatcher.group(1)
            def cfgV = android.defaultConfig.versionName
            def cfgB = "${android.defaultConfig.versionCode}"
            if (v != cfgV || b != cfgB) {
                throw new GradleException("Version mismatch: build.gradle on disk is ${v} (build ${b}) but this build was configured with ${cfgV} (build ${cfgB}). The APK manifest would get the configured version. Run bumpVersion in a SEPARATE Gradle invocation before the build (./gradlew bumpVersion, then ./gradlew release).")
            }
            def projRoot = project.projectDir.parentFile.parentFile
            ["app.js", "www/app.js", "android/app/src/main/assets/public/app.js"].each { rel ->
                def f = new File(projRoot, rel)
                if (!f.exists()) return
                def t = f.text
                t = t.replaceAll(/prof_version:'Version [^']*'/, "prof_version:'Version ${v} (build ${b})'")
                t = t.replaceAll(/prof_version:'ভার্সন [^']*'/, "prof_version:'ভার্সন ${v} (বিল্ড ${b})'")
                f.text = t
            }
            println "Stamped web version: ${v} (build ${b})"
        }
    }
}

// Resolve the canonical signing keystore: the App Store project's
// debug.keystore (shared signing identity across all apps, synced between
// machines via Google Drive). Override with -PcanonicalKeystore=<path>.
def canonicalKeystoreSource() {
    def candidates = []
    def override = project.findProperty('canonicalKeystore')
    if (override) candidates << override
    candidates += [
        'C:/Google Drive/mahmudulhasandhk70/OpenCode/App Store/debug.keystore',
        '/home/mhasanbogura/Google Drive/mahmudulhasandhk70/OpenCode/App Store/debug.keystore'
    ]
    candidates.collect { file(it) }.find { it.exists() }
}

// Gradle task: keeps android/keystore/debug.keystore identical to the
// canonical App Store debug keystore. Runs automatically before every build.
task syncKeystore {
    group = 'signing'
    description = 'Syncs android/keystore/debug.keystore from the canonical App Store debug.keystore'
    doLast {
        def local = rootProject.file('keystore/debug.keystore')
        def source = canonicalKeystoreSource()
        if (source != null) {
            def differs = !local.exists() || !java.util.Arrays.equals(
                java.nio.file.Files.readAllBytes(source.toPath()),
                java.nio.file.Files.readAllBytes(local.toPath()))
            if (differs) {
                local.parentFile.mkdirs()
                java.nio.file.Files.copy(source.toPath(), local.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                println "Signing keystore synced from canonical source: ${source}"
            } else {
                println "Signing keystore already matches canonical source"
            }
        } else if (!local.exists()) {
            throw new GradleException(
                "No signing keystore available: canonical App Store debug.keystore not found " +
                "and ${local} does not exist.")
        } else {
            println "WARNING: canonical App Store keystore not found; using existing ${local}"
        }
    }
}

// Keeps android/app/src/main/assets/public in sync with www/ so every build
// ships the latest web assets (Capacitor serves these at runtime).
task syncWebAssets(type: Copy) {
    description = 'Copies www/* into android/app/src/main/assets/public'
    from "${project.projectDir}/../../www"
    into "${project.projectDir}/src/main/assets/public"
}

// Local preview server: serves www/ at http://localhost:1003 (override with
// -PpreviewPort=xxxx) so web changes can be viewed in a browser while building.
// Files are read from disk on every request - just refresh to see edits.
// Starts automatically with assembleDebug, keeps running in the Gradle daemon
// across builds (idempotent), and stops with the daemon (gradlew --stop).
task previewServer {
    group = 'preview'
    description = 'Serves www/ at http://localhost:1003 (live preview of web changes)'
    doLast {
        def docRoot = new File(project.projectDir.parentFile.parentFile, 'www').canonicalFile
        if (!docRoot.isDirectory()) {
            throw new GradleException("www/ folder not found: ${docRoot}")
        }
        def port = ((project.findProperty('previewPort') ?: '1003') as String) as int
        if (System.getProperty('mess.preview.running') == '1') {
            println "Preview server already running: http://localhost:${port}/"
            return
        }
        // Cross-daemon check: if OUR server already answers on this port, skip.
        try {
            def conn = java.net.URI.create("http://127.0.0.1:${port}/").toURL().openConnection()
            conn.connectTimeout = 400
            conn.readTimeout = 400
            def ours = conn.getHeaderField('X-Preview-Server') == 'messmanager'
            conn.disconnect()
            if (ours) {
                println "Preview server already running: http://localhost:${port}/"
                return
            }
        } catch (Exception ignored) { }
        def mime = [
            'html': 'text/html; charset=utf-8', 'css': 'text/css; charset=utf-8',
            'js': 'application/javascript; charset=utf-8', 'mjs': 'application/javascript; charset=utf-8',
            'json': 'application/json; charset=utf-8', 'png': 'image/png', 'jpg': 'image/jpeg',
            'jpeg': 'image/jpeg', 'gif': 'image/gif', 'svg': 'image/svg+xml', 'webp': 'image/webp',
            'ico': 'image/x-icon', 'woff2': 'font/woff2', 'woff': 'font/woff', 'ttf': 'font/ttf',
            'otf': 'font/otf', 'md': 'text/markdown; charset=utf-8', 'txt': 'text/plain; charset=utf-8',
            'wasm': 'application/wasm', 'xml': 'application/xml',
            'webmanifest': 'application/manifest+json'
        ]
        def server
        try {
            server = com.sun.net.httpserver.HttpServer.create(new java.net.InetSocketAddress(port), 0)
        } catch (java.net.BindException e) {
            println "WARNING: preview server not started - port ${port} is already in use"
            return
        }
        server.createContext('/') { exchange ->
            def method = exchange.requestMethod
            try {
                if (method != 'GET' && method != 'HEAD') {
                    exchange.sendResponseHeaders(405, -1)
                    exchange.close()
                    return
                }
                def rel = java.net.URLDecoder.decode(exchange.requestURI.path, 'UTF-8')
                if (rel == '/' || rel.endsWith('/')) rel += 'index.html'
                def target = new File(docRoot, rel).canonicalFile
                def inside = target.path == docRoot.path ||
                        target.path.startsWith(docRoot.path + File.separator)
                if (!inside || !target.isFile()) {
                    def msg = '404 Not Found'.bytes
                    exchange.responseHeaders.set('Content-Type', 'text/plain; charset=utf-8')
                    exchange.sendResponseHeaders(404, msg.length)
                    if (method == 'GET') exchange.responseBody.write(msg)
                    exchange.close()
                    return
                }
                def name = target.name
                def ext = name.contains('.') ? name.substring(name.lastIndexOf('.') + 1).toLowerCase() : ''
                def body = target.bytes
                exchange.responseHeaders.set('Content-Type', mime[ext] ?: 'application/octet-stream')
                exchange.responseHeaders.set('Cache-Control', 'no-store')
                exchange.responseHeaders.set('X-Preview-Server', 'messmanager')
                exchange.sendResponseHeaders(200, method == 'HEAD' ? -1 : body.length)
                if (method == 'GET') exchange.responseBody.write(body)
                exchange.close()
            } catch (Exception e) {
                try { exchange.sendResponseHeaders(500, -1) } catch (ignored) { }
                try { exchange.close() } catch (ignored2) { }
            }
        }
        server.executor = java.util.concurrent.Executors.newFixedThreadPool(4)
        server.start()
        System.setProperty('mess.preview.running', '1')
        println "Preview server: http://localhost:${port}/  (serving ${docRoot})"
    }
}

project.afterEvaluate {
    tasks.findByName('assembleDebug')?.dependsOn('stampVersion')
    tasks.findByName('mergeDebugAssets')?.dependsOn('stampVersion', 'syncWebAssets')
    tasks.findByName('mergeReleaseAssets')?.dependsOn('syncWebAssets')
    tasks.findByName('syncWebAssets')?.dependsOn('stampVersion')
    tasks.findByName('preBuild')?.dependsOn('syncKeystore')
    // Local preview server (http://localhost:1003) is up before every build.
    tasks.findByName('assembleDebug')?.dependsOn('previewServer')
    // Every build is published automatically: Drive + git push + GitHub Release.
    tasks.findByName('assembleDebug')?.finalizedBy('release')
}

// --- Release helpers (cross-platform: no bash/cp/rm, resolves gh per-OS) ----
def ghPath() {
    def candidates = [project.findProperty('ghPath'),
                      'C:/Program Files/GitHub CLI/gh.exe',
                      "${System.getProperty('user.home')}/.local/bin/gh",
                      '/usr/local/bin/gh', '/usr/bin/gh'].findAll { it }
    def found = candidates.collect { file(it) }.find { it.exists() }
    found ? found.absolutePath : 'gh'
}

def driveStoreDir() {
    def candidates = ['C:/Google Drive/mahmudulhasandhk70/App Store/Android',
                      "${System.getProperty('user.home')}/Google Drive/mahmudulhasandhk70/App Store/Android",
                      '/home/mhasanbogura/Google Drive/mahmudulhasandhk70/App Store/Android']
    candidates.collect { file(it) }.find { it.isDirectory() }
}

// Runs a command; returns its exit code. Throws on failure unless ignored.
def runCmd = { List<String> args, File dir, boolean ignoreFailure ->
    def out = new ByteArrayOutputStream()
    def err = new ByteArrayOutputStream()
    def result = project.exec {
        workingDir dir
        commandLine args
        standardOutput out
        errorOutput err
        ignoreExitValue true
    }
    if (result.exitValue != 0 && !ignoreFailure) {
        throw new GradleException(
            "Release step failed (exit ${result.exitValue}): ${args.join(' ')}\n" +
            "${out.toString()}${err.toString()}")
    }
    result.exitValue as int
}

// release: publishes EVERY build — copies the APK to the Google Drive store
// (used by the in-app Update App scan), commits+pushes the repo, and creates/
// refreshes the GitHub Release for this version. Runs automatically after
// assembleDebug (see afterEvaluate above). Opt out with -PskipRelease.
task release {
    group = 'distribution'
    description = 'Deploys the APK to Google Drive, pushes git and publishes a GitHub Release'
    dependsOn 'assembleDebug'
    doLast {
        if (project.hasProperty('skipRelease')) {
            println 'Release skipped (-PskipRelease)'
            return
        }
        def buildState = tasks.findByName('assembleDebug')?.state
        if (buildState != null && buildState.failure != null) {
            println 'Build failed - release skipped'
            return
        }

        def content = versionFile.text
        def v = (content =~ /versionName "([\d.]+)"/)[0][1]
        def b = ((content =~ /versionCode (\d+)/)[0][1]) as int
        def repoRoot = project.projectDir.parentFile.parentFile
        def apkPath = file("${buildDir}/outputs/apk/debug/app-debug.apk")
        if (!apkPath.exists()) {
            throw new GradleException("Built APK not found: ${apkPath}")
        }
        def apkName = "MessManager.apk"
        def tagName = "v${v}"
        def gh = ghPath()
        def storeApkName = "Mess Manager_com.mahmuduls.messmanager_v${v}_build_${b}.apk"

        println "Releasing Mess Manager v${v} (build ${b})..."

        // 1. Refresh the tracked APK at the repo root
        java.nio.file.Files.copy(apkPath.toPath(), new File(repoRoot, apkName).toPath(),
            java.nio.file.StandardCopyOption.REPLACE_EXISTING)

        // 2. Google Drive store (scanned by the in-app Update App feature)
        def store = driveStoreDir()
        if (store != null) {
            store.listFiles()?.each { f ->
                if (f.name == 'MessManager.apk' || f.name == 'mess-manager.apk' ||
                        f.name.startsWith('Mess Manager_com.mahmuduls.messmanager_')) {
                    f.delete()
                }
            }
            java.nio.file.Files.copy(apkPath.toPath(), new File(store, storeApkName).toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            println "Deployed to Drive: ${store}/${storeApkName}"
        } else {
            println 'WARNING: Google Drive store folder not found - skipping Drive deploy'
        }

        // 3. Commit and push the source tree
        runCmd(['git', 'add', '-A'], repoRoot, true)
        runCmd(['git', 'commit', '-m', "v${v} build ${b}"], repoRoot, true) // no-op if nothing changed
        runCmd(['git', 'push'], repoRoot, false)

        // 4. GitHub Release (recreated so the tag always points at this build)
        def releaseExists = runCmd([gh, 'release', 'view', tagName], repoRoot, true) == 0
        if (releaseExists) {
            runCmd([gh, 'release', 'delete', tagName, '--yes'], repoRoot, false)
        }
        runCmd(['git', 'push', '--delete', 'origin', tagName], repoRoot, true) // may not exist
        runCmd([gh, 'release', 'create', tagName, new File(repoRoot, apkName).absolutePath,
                '--title', "Mess Manager v${v} (build ${b})",
                '--notes', "Mess Manager v${v} build ${b}\nPackage: com.mahmuduls.messmanager",
                '--latest'], repoRoot, false)

        println "Released ${tagName} on GitHub with ${apkName}"
    }
}

android {
    namespace "com.mahmuduls.messmanager"
    compileSdk rootProject.ext.compileSdkVersion

    // Fixed signing keystore: every build MUST sign with the same key so that
    // Android accepts new APKs as updates over previously installed versions.
    // Canonical key: the App Store project's debug.keystore (shared identity
    // across all apps, synced via Google Drive). The syncKeystore task copies
    // it to android/keystore/debug.keystore before every build; the build
    // fails if neither the source nor the local copy exists.
    signingConfigs {
        fixed {
            def localKs = rootProject.file('keystore/debug.keystore')
            if (!localKs.exists()) {
                def source = canonicalKeystoreSource()
                if (source != null) {
                    localKs.parentFile.mkdirs()
                    java.nio.file.Files.copy(source.toPath(), localKs.toPath(),
                        java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                } else {
                    throw new GradleException(
                        "Fixed signing keystore missing: ${localKs}\n" +
                        "and no canonical source (App Store debug.keystore) found. " +
                        "Copy the App Store keystore to android/keystore/debug.keystore before building.")
                }
            }
            storeFile localKs
            storePassword project.findProperty('fixedKsStorePassword') ?: 'android'
            keyAlias project.findProperty('fixedKsKeyAlias') ?: 'androiddebugkey'
            keyPassword project.findProperty('fixedKsKeyPassword') ?: 'android'
        }
    }
    defaultConfig {
        applicationId "com.mahmuduls.messmanager"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 762
        versionName "1.6.9"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

